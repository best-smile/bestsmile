<html>

  <style>

    /* 騾蜍､譎ゅ・譛ｬ莠ｺ遒ｺ隱咲判髱｢ */
    #confirmScreen {
      display: none; position: fixed; inset: 0; background: #fff; z-index: 10;
      flex-direction: column; align-items: center; padding: 4vw;
      box-sizing: border-box; text-align: center;
      /* 菴懈･ｭ縺悟､壹＞譌･縺ｯ荳ｭ霄ｫ縺檎判髱｢繧医ｊ鬮倥￥縺ｪ繧九ゆｸ翫°繧我ｸｦ縺ｹ縺ｦ繧ｹ繧ｯ繝ｭ繝ｼ繝ｫ縺ｧ縺阪ｋ繧医≧縺ｫ縺励↑縺・→
         縲後°縺上↓繧薙阪・繧ｿ繝ｳ縺檎判髱｢縺ｮ螟悶↓蜃ｺ縺ｦ縺励∪縺・・*/
      justify-content: flex-start; overflow: hidden;

    /* 荳奇ｼ亥錐蜑阪・譎る俣・会ｼ丈ｸｭ・医＠縺斐→縺ｮ蜀・ｨｳ・昴≠縺ｵ繧後◆繧峨％縺薙□縺代せ繧ｯ繝ｭ繝ｼ繝ｫ・会ｼ丈ｸ具ｼ医％縺・■繧薙・繝懊ち繝ｳ・峨・
       縺薙≧縺励↑縺・→菴懈･ｭ縺悟､壹＞譌･縺ｫ蜷郁ｨ医→繝懊ち繝ｳ縺檎判髱｢縺ｮ螟悶∈蜃ｺ縺ｦ縺励∪縺・・*/
    #confirmName {
      flex: 0 0 auto; font-size: 5.5vw; font-weight: bold; color: #1B5E20; margin-bottom: 2vw;
    }
    /* 縺倥°繧薙・1陦後↓縺ｾ縺ｨ繧√ｋ縲ゅ＠縺斐→縺ｮ蜀・ｨｳ縺ｫ鬮倥＆繧貞屓縺吶◆繧√・*/
    #cTimeRow { display: flex; align-items: baseline; justify-content: space-between; gap: 3vw; }
    #cTimeRow .cLabel { margin-bottom: 0; }
    #cTimeRow .cValue { font-size: 5.5vw; }
    .cRow {
      flex: 0 0 auto;

    /* 菴懈･ｭ縺悟､壹＞譌･縺ｯ縲√％縺ｮ谺・□縺代′繧ｹ繧ｯ繝ｭ繝ｼ繝ｫ縺吶ｋ */
    #cDetail { flex: 1 1 auto; min-height: 0; overflow-y: auto; }

    .dTask { font-size: 4.6vw; font-weight: bold; color: #222; }

    #confirmBtns button {

    /* 閨ｷ蜩｡繝｢繝ｼ繝・*/
    #staffScreen {

  </style>
</head>
<body>

  </div>
  <div id="configNote"></div>
  <!-- 繧ｿ繝悶Ξ繝・ヨ縺悟商縺・ヵ繧｡繧､繝ｫ繧呈雫繧薙〒縺・↑縺・°縲√◎縺ｮ蝣ｴ縺ｧ隕句・縺代ｋ縺溘ａ縺ｮ迚育分蜿ｷ -->
  <div id="appVer"></div>

  <!-- 騾蜍､譎ゅ・譛ｬ莠ｺ遒ｺ隱・-->
  <div id="confirmScreen">
    <div id="confirmName"></div>
    <div class="cRow" id="cTimeRow"><div class="cLabel">縺阪ｇ縺・・ 縺倥°繧・/div><div class="cValue" id="cTime"></div></div>
    <div class="cRow" id="cWorkRow"><div class="cLabel">縺阪ｇ縺・・ 縺励＃縺ｨ</div><div id="cDetail"></div></div>
    <div class="cRow" id="cTotalRow"><div class="cLabel">縺阪ｇ縺・・ 縺薙≧縺｡繧・/div><div class="cValue" id="cWage"></div></div>
    <div id="confirmBtns">
      <button id="btnNg" onclick="onDiffer()">縺｡縺後≧</button>
      <button id="btnOk" onclick="onConfirm()">笨・縺九￥縺ｫ繧・/button>
    </div>
    <div id="staffCall">縺励ｇ縺上＞繧薙ｒ 繧医ｓ縺ｧ縺上□縺輔＞</div>
    <div id="staffEnter"><button onclick="openStaff()">閨ｷ蜩｡縺ｮ譁ｹ縺ｯ縺薙■繧・/button></div>
  </div>

  <!-- 閨ｷ蜩｡繝｢繝ｼ繝会ｼ域囓險ｼ逡ｪ蜿ｷ縺ｧ菫晁ｭｷ・・-->
  <div id="staffScreen">
    <h2 id="staffTitle">閨ｷ蜩｡繝｢繝ｼ繝・/h2>
    <div id="staffWho"></div>
    <div id="staffMsg"></div>

    <div class="box" id="pinBox">
      <label>證苓ｨｼ逡ｪ蜿ｷ</label>
      <input id="pinInput" type="password" inputmode="numeric">
      <button class="btn" onclick="doStaffAuth()">遒ｺ隱・/button>
      <button class="btn btnGray" onclick="closeStaff()">繧・ａ繧・/button>
    </div>

    <!-- 譛ｬ譌･縺ｮ蜃ｺ蟶ｭ荳隕ｧ・医∪縺ｨ繧√※繝√ぉ繝・け・・-->
    <div class="box" id="listBox" style="display:none">

    <!-- 閨ｷ蜩｡繝｡繝九Η繝ｼ -->
    <div class="box" id="menuBox" style="display:none">
      <button class="btn" onclick="openAttendList()">譛ｬ譌･縺ｮ蜃ｺ蟶ｭ繧偵メ繧ｧ繝・け縺吶ｋ</button>
      <button class="btn" onclick="showPick()">險倬鹸繧剃ｿｮ豁｣縺吶ｋ</button>
      <button class="btn btnGray" onclick="closeStaff()">縺ｨ縺倥ｋ</button>
    </div>

    <!-- 譌･荳ｭ縺ｫ菫ｮ豁｣縺吶ｋ譎・ 隱ｰ縺ｮ險倬鹸繧堤峩縺吶°驕ｸ縺ｶ -->
    <div class="box" id="pickBox" style="display:none">
      <label>縺ｩ縺ｪ縺溘・險倬鹸繧堤峩縺励∪縺吶°</label>
      <div style="font-size:3.6vw;color:#1B5E20;margin-bottom:2vw">
        QR繧ｫ繝ｼ繝峨ｒ縺九＊縺吶°縲∝茜逕ｨ閠・D繧貞・蜉帙＠縺ｦ縺上□縺輔＞
      </div>
      <div class="slotRow">
        <input id="pickId" type="text" placeholder="萓・ S001">

      </div>

      <button class="btn btnGray" onclick="closeStaff()">菫ｮ豁｣繧堤ｵゅ∴縺ｦ謌ｻ繧・/button>
    </div>
  </div>

  <script>
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxoGn2hYOduL5Y2MH-PU_kQARERwjADfyT_GgWXRJ1gfQhUeNPXVlE3DL67nj-nb1sarw/exec";

    if (WEBAPP_URL.indexOf("WEBAPP_URL_HERE") !== -1) {
      document.getElementById("configNote").textContent =
        "險ｭ螳壹′譛ｪ螳御ｺ・〒縺呻ｼ・canner.html蜀・・WEBAPP_URL繧呈嶌縺肴鋤縺医※縺上□縺輔＞・・;
    }

    // 逕ｻ髱｢繧堤峩縺励◆繧牙ｿ・★荳翫￡繧九ゅち繝悶Ξ繝・ヨ縺悟商縺・ヵ繧｡繧､繝ｫ繧定｡ｨ遉ｺ縺励※縺・↑縺・°縺ｮ遒ｺ隱阪↓菴ｿ縺・・
    const APP_VERSION = "v2026-09-22e";
    document.getElementById("appVer").textContent = APP_VERSION;

    let busy = false;
    let lastResultAt = 0;
    let jsonpCounter = 0;
    let confirmUid = null;
    let staffPickMode = false;   // 譌･荳ｭ縺ｮ菫ｮ豁｣縺ｧ縲∝ｯｾ雎｡閠・ｒ縺薙ｌ縺九ｉ驕ｸ縺ｶ迥ｶ諷・

    // 隱ｭ縺ｿ蜿悶ｊ縺縺代・謫堺ｽ懊ょ､ｱ謨励＠縺ｦ繧ょｮ牙・縺ｫ繧・ｊ逶ｴ縺帙ｋ・域嶌縺崎ｾｼ縺ｿ邉ｻ縺ｯ莠碁㍾險倬鹸縺ｫ縺ｪ繧九・縺ｧ繧・ｊ逶ｴ縺輔↑縺・ｼ・
    const RETRYABLE = ["summary", "taskList", "staffAuth"];

    function callApi(params, onSuccess, onError) {
      const retryable = RETRYABLE.indexOf(params.action) !== -1;
      callApiOnce(params, onSuccess, function (err) {
        // Apps Script縺ｯ荵・＠縺ｶ繧翫・螳溯｡後□縺ｨ襍ｷ蜍輔↓譎る俣縺後°縺九ｋ縺薙→縺後≠繧九◆繧√∽ｸ蠎ｦ縺縺代ｄ繧顔峩縺・
        if (retryable) callApiOnce(params, onSuccess, onError);
        else onError(err);
      });
    }

    function callApiOnce(params, onSuccess, onError) {
      const cbName = "jsonp_cb_" + (jsonpCounter++);
      const timeoutId = setTimeout(() => { cleanup(); onError(new Error("繧ｿ繧､繝繧｢繧ｦ繝・)); }, 30000);

      function cleanup() {
        clearTimeout(timeoutId);
        delete window[cbName];
        const s = document.getElementById(cbName);
        if (s) s.remove();
      }

      window[cbName] = function (data) { cleanup(); onSuccess(data); };

      const query = Object.keys(params).map(k =>
        encodeURIComponent(k) + "=" + encodeURIComponent(params[k])
      ).join("&") + "&callback=" + cbName;

      const script = document.createElement("script");
      script.id = cbName;
      script.src = WEBAPP_URL + "?" + query;
      script.onerror = () => { cleanup(); onError(new Error("騾壻ｿ｡繧ｨ繝ｩ繝ｼ")); };
      document.body.appendChild(script);
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (busy || now - lastResultAt < 2000) return;
      // 閨ｷ蜩｡縺悟ｯｾ雎｡閠・ｒ驕ｸ繧薙〒縺・ｋ譛荳ｭ縺ｯ縲∵遠蛻ｻ縺帙★縺ｫ縺昴・莠ｺ縺ｮ險倬鹸繧帝幕縺・
      if (staffPickMode && document.getElementById("pickBox").style.display === "block") {
        lastResultAt = now;
        pickTarget(decodedText.trim());
        return;
      }
      if (document.getElementById("staffScreen").style.display === "flex") return;
      if (document.getElementById("confirmScreen").style.display === "flex") return;
      busy = true;
      lastResultAt = now;
      // 蠢懃ｭ斐∪縺ｧ謨ｰ遘偵°縺九ｋ縲ょｾ・▲縺ｦ縺・ｋ髢薙ｂ菴輔°蜃ｺ縺励※縺翫°縺ｪ縺・→縲∬ｪｭ繧√※縺・↑縺・→諤昴ｏ繧後ｋ縲・
      const el = document.getElementById("message");
      el.className = "";
      el.textContent = "繧医∩縺ｨ繧翫∪縺励◆縲縺励・繧峨￥ 縺翫∪縺｡縺上□縺輔＞窶ｦ";
      callApi({ uid: decodedText.trim() }, onScanResult, onScanError);
    }

    function onScanResult(res) {
      const el = document.getElementById("message");
      if (res.status === "ok") {
        el.className = "ok";
        // 譚･謇縺矩謇縺九ｒ蠢・★蜃ｺ縺吶よ擂謇縺縺ｨ遒ｺ隱咲判髱｢縺ｯ蜃ｺ縺ｪ縺・・縺ｧ縲√←縺｡繧峨〒謇灘綾縺輔ｌ縺溘°蛻・°繧峨↑縺・→蝗ｰ繧九・
        el.textContent = res.kubun === "譚･謇"
          ? `${res.name}縺輔ｓ 縺翫・繧医≧縺斐＊縺・∪縺呻ｼ・{res.time} 譚･謇・荏
          : `${res.name}縺輔ｓ 縺翫▽縺九ｌ縺輔∪縺ｧ縺励◆・・{res.time} 騾謇・荏;
        // 騾蜍､縺ｮ縺ｨ縺阪・蠖捺律繧ｵ繝槭Μ繝ｼ繧貞・縺励※譛ｬ莠ｺ遒ｺ隱阪∈
        if (res.kubun === "騾謇") {
          if (res.summary && res.summary.status === "ok") {
            setTimeout(() => showConfirm(res.summary), 300);
            return;
          }
          // 遒ｺ隱咲判髱｢繧貞・縺帙↑縺・凾縺ｯ逅・罰繧貞・縺吶るｻ吶▲縺ｦ蜃ｺ縺ｪ縺・→蜴溷屏縺悟・縺九ｉ縺ｪ縺上↑繧九◆繧√・
          el.className = "invalid";

          sel2.appendChild(b2);
          taskList.forEach(name => {
            const op = document.createElement("option");
            op.value = name; op.textContent = name;
            sel2.appendChild(op);
          });
          sel2.value = (s.slotTasks2 && s.slotTasks2[i]) || "";
          sel2.onchange = () => saveWork(i, sel2.value, "2");
          wrap.appendChild(lab2);
          wrap.appendChild(sel2);
        }

        box.appendChild(wrap);
      });
    }

    function saveSlotTime(slotIndex, range) {
      callApi(withPin({ uid: confirmUid, action: "updateSlotTime", slot: slotIndex, range: range }),
        (res) => { afterSave(res); if (res.status === "ok") buildSlotList(res); },
        () => { document.getElementById("staffMsg").textContent = "騾壻ｿ｡繧ｨ繝ｩ繝ｼ"; });
    }

    function withPin(params) {
      params.pin = document.getElementById("pinInput").value.trim();
      return params;
    }

    function afterSave(res) {
      const msg = document.getElementById("staffMsg");
      if (res.status === "ok") {
        staffSummary = res;
        let text = "菫晏ｭ倥＠縺ｾ縺励◆・・ + res.minutes + "蛻・/ " + Number(res.wage || 0).toLocaleString() + "蜀・ｼ・;
        // 譎る俣縺縺大・繧後※菴懈･ｭ繧帝∈縺ｳ蠢倥ｌ繧九→0蛻・↓縺ｪ縺｣縺ｦ縺励∪縺・◆繧√∵ｰ励▼縺代ｋ繧医≧縺ｫ縺吶ｋ
        if (res.warnSlots && res.warnSlots.length) {
          text += "縲笞 " + res.warnSlots.join("縲・) + " 縺ｯ譎る俣縺悟・縺｣縺ｦ縺・∪縺吶′菴懈･ｭ縺梧悴驕ｸ謚槭〒縺呻ｼ・蛻・↓縺ｪ繧翫∪縺呻ｼ・;
          msg.style.color = "#B71C1C";
        } else {
          msg.style.color = "#1B5E20";
        }
        msg.textContent = text;
      } else {
        msg.style.color = "#B71C1C";
        msg.textContent = res.message || "菫晏ｭ倥〒縺阪∪縺帙ｓ縺ｧ縺励◆";
      }
    }

    function saveTime(which) {
      const v = document.getElementById(which === "in" ? "editIn" : "editOut").value;
      if (!v) return;
      callApi(withPin({ uid: confirmUid, action: "updateTime", which: which, time: v }), afterSave,
        () => { document.getElementById("staffMsg").textContent = "騾壻ｿ｡繧ｨ繝ｩ繝ｼ"; });
    }

    function saveLunch() {
      callApi(withPin({ uid: confirmUid, action: "updateLunch", lunch: document.getElementById("editLunch").value }),
        afterSave, () => { document.getElementById("staffMsg").textContent = "騾壻ｿ｡繧ｨ繝ｩ繝ｼ"; });
    }

    function saveWork(slotIndex, task, which) {
      callApi(withPin({ uid: confirmUid, action: "updateWork", slot: slotIndex, task: task, which: which || "1" }),
        (res) => { afterSave(res); if (res.status === "ok") buildSlotList(res); },
        () => { document.getElementById("staffMsg").textContent = "騾壻ｿ｡繧ｨ繝ｩ繝ｼ"; });
    }

    function onScanError() {
      // 謇灘綾縺ｯ繧ｵ繝ｼ繝舌・蛛ｴ縺ｧ蜈医↓貂医ｓ縺ｧ縺・ｋ縺薙→縺後≠繧九ゅ☆縺占ｪｭ縺ｿ逶ｴ縺吶→縲碁｣邯夊ｪｭ縺ｿ蜿悶ｊ縲阪〒蠑ｾ縺九ｌ繧九◆繧√・
      // 縲後ｂ縺・ｸ蠎ｦ縲阪〒縺ｯ縺ｪ縺剰・蜩｡縺ｫ遏･繧峨○繧区｡亥・縺ｫ縺吶ｋ縲・
      const el = document.getElementById("message");
      el.className = "invalid";
      el.textContent = "縺､縺・＠繧薙お繝ｩ繝ｼ縲ゅ≧縺｡縺薙￥縺ｯ 縺阪ｍ縺上＆繧後※ 縺・ｋ縺九ｂ 縺励ｌ縺ｾ縺帙ｓ・医＠繧・￥縺・ｓ繧・繧医ｓ縺ｧ縺上□縺輔＞・・;
      busy = false;
    }

    function showManual() {
      document.getElementById("manualBox").style.display = "block";
    }

    function submitManual() {
      const uid = document.getElementById("manualId").value.trim();
      if (!uid) return;
      callApi({ uid: uid }, (res) => {
        onScanResult(res);
        document.getElementById("manualBox").style.display = "none";
        document.getElementById("manualId").value = "";
      }, onScanError);
    }

    const html5QrCode = new Html5Qrcode("reader");
    Html5Qrcode.getCameras().then((cameras) => {
      const cameraId = cameras.length > 0 ? cameras[cameras.length - 1].id : null;
      if (!cameraId) {
        document.getElementById("message").textContent = "繧ｫ繝｡繝ｩ縺瑚ｦ九▽縺九ｊ縺ｾ縺帙ｓ縲よ焔蜈･蜉帙ｒ縺泌茜逕ｨ縺上□縺輔＞";
        return;
      }
      html5QrCode.start(cameraId, { fps: 10, qrbox: 250 }, onScanSuccess);
    }).catch(() => {
      document.getElementById("message").textContent = "繧ｫ繝｡繝ｩ縺ｮ襍ｷ蜍輔↓螟ｱ謨励＠縺ｾ縺励◆縲よ焔蜈･蜉帙ｒ縺泌茜逕ｨ縺上□縺輔＞";
    });
  </script>
</body>
